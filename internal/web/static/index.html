<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>asokit dashboard</title>
<style>
  :root {
    color-scheme: light;
    --plane:       #f9f9f7;
    --surface:     #fcfcfb;
    --text:        #0b0b0b;
    --text-2:      #52514e;
    --muted:       #898781;
    --grid:        #e1e0d9;
    --baseline:    #c3c2b7;
    --series:      #2a78d6;
    --good:        #006300;
    --bad:         #d03b3b;
    --border:      rgba(11,11,11,0.10);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane:    #0d0d0d;
      --surface:  #1a1a19;
      --text:     #f0efec;
      --text-2:   #c3c2b7;
      --muted:    #898781;
      --grid:     #2c2c2a;
      --baseline: #383835;
      --series:   #3987e5;
      --good:     #0ca30c;
      --bad:      #e66767;
      --border:   rgba(255,255,255,0.10);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane:    #0d0d0d;
    --surface:  #1a1a19;
    --text:     #f0efec;
    --text-2:   #c3c2b7;
    --muted:    #898781;
    --grid:     #2c2c2a;
    --baseline: #383835;
    --series:   #3987e5;
    --good:     #0ca30c;
    --bad:      #e66767;
    --border:   rgba(255,255,255,0.10);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }

  header.top {
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 12px 20px; margin-bottom: 4px;
  }
  header.top h1 { font-size: 22px; margin: 0; font-weight: 650; }
  header.top .meta { color: var(--text-2); font-size: 14px; }
  header.top .spacer { flex: 1; }
  .controls { display: flex; gap: 8px; align-items: center; }
  button.ctl {
    font: inherit; font-size: 13px; color: var(--text-2);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 11px; cursor: pointer;
  }
  button.ctl:hover { color: var(--text); }
  button.ctl[aria-pressed="true"] { color: var(--text); border-color: var(--baseline); font-weight: 600; }

  .note {
    color: var(--muted); font-size: 12.5px; margin: 6px 0 22px;
    max-width: 70ch;
  }

  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 16px 10px;
  }
  .card .kw { font-size: 14px; color: var(--text-2); margin: 0 0 2px; font-weight: 600; }
  .card .rankrow { display: flex; align-items: baseline; gap: 10px; }
  .card .rank { font-size: 30px; font-weight: 680; letter-spacing: -0.5px; }
  .card .rank.none { font-size: 16px; font-weight: 500; color: var(--muted); }
  .delta { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--bad); }
  .delta.flat, .delta.new, .delta.out { color: var(--muted); font-weight: 500; }
  .card .asof { color: var(--muted); font-size: 12px; margin-top: 8px; }
  svg.chart { width: 100%; height: 120px; display: block; margin-top: 10px; overflow: visible; }

  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  table.view { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.view th, table.view td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); }
  table.view th { color: var(--text-2); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  table.view td.num { font-variant-numeric: tabular-nums; }
  .hidden { display: none; }

  /* hover tooltip */
  .tip {
    position: fixed; pointer-events: none; z-index: 10;
    background: var(--text); color: var(--surface);
    font-size: 12px; padding: 5px 8px; border-radius: 6px;
    transform: translate(-50%, -130%); white-space: nowrap; opacity: 0;
    transition: opacity .08s;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>asokit</h1>
      <span class="meta" id="meta"></span>
      <span class="spacer"></span>
      <div class="controls">
        <button class="ctl" id="view-charts" aria-pressed="true">Charts</button>
        <button class="ctl" id="view-table" aria-pressed="false">Table</button>
        <button class="ctl" id="theme" title="Toggle theme">◐</button>
      </div>
    </header>
    <p class="note">
      Position is the iTunes Search API's relevance ranking — a proxy for App
      Store search ranking, reliable for tracking movement over time. Lower is
      better; “—” means the app was outside the top results.
    </p>

    <div id="charts" class="grid"></div>
    <div id="table" class="hidden"></div>
    <div id="tip" class="tip"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
