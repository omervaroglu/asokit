# asokit configuration — copy to asokit.yaml and edit.
#
# search_limit: how many results to fetch per keyword (max 200). Optional.
search_limit: 200

# store_top: how many of the top results to keep per snapshot, for the
#   competition metrics and competitor tracking. Optional (default 50, capped at
#   search_limit). A competitor ranked below store_top can't be tracked.
store_top: 50

# apps: one entry per application you track. Each app has its own markets,
# keywords, competitors and relevance settings, and keeps its own history.
apps:
    # id: the numeric App Store id of the app. It is the number in an App Store
    #   URL, e.g. apps.apple.com/app/calm/id571800810 -> 571800810
  - id: 571800810
    # name: optional display label for the dashboard. When omitted, asokit fills
    #   it (and the app icon) from the App Store on the next run.
    name: Calm

    # relevance: what counts as "the same type" as this app, for the relevance
    #   metric (how many of the top 10 are competitors like you). Optional.
    #   - genre_ids: App Store category ids. If omitted, the app's own category
    #     is looked up automatically once per run.
    #   - title_terms: words whose presence in a result's title also makes it
    #     count as the same type.
    relevance:
      # genre_ids: ["6007"]        # 6007 = Education, 6015 = Finance, 6013 = Health…
      title_terms: [sleep, meditation, calm, relax]

    # competitors: other apps to track alongside this one. Their rank per keyword
    #   is derived from the stored results (no extra API calls), so it is visible
    #   only down to store_top. Optional.
    competitors:
      - { id: 493145008, name: Headspace }
      - { id: 337472899, name: Insight Timer }

    # markets: one entry per storefront. Each market has its own country code and
    #   keyword list (the same app is often marketed with different keywords per
    #   country/language) and keeps its own history.
    #
    # phrases: an optional second group of terms per market, tracked exactly like
    #   keywords but shown as a separate section (e.g. multi-word search phrases).
    markets:
      - country: us
        keywords:
          - meditation
          - sleep
          - calm
        phrases:
          - sleep sounds
          - guided meditation
      - country: de
        keywords:
          - meditation
          - schlaf
          - entspannung

  # A second app, with its own markets and competitors:
  # - id: 493145008
  #   name: Headspace
  #   markets:
  #     - country: us
  #       keywords: [meditation, mindfulness, sleep]

# (Old single-app configs — a top-level `app_id:` with `markets:`, or the even
# older flat `country:` + `keywords:` — are still read and migrated into a
# single app automatically.)
